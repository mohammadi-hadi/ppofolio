# v6 hourly + shorts config
timeframe: 1h
bars_per_day: 24
bars_per_year: 8760

assets:
  - symbol: BTC/USDT
    coinmetrics: btc
    slippage_std: 0.0005
  - symbol: ETH/USDT
    coinmetrics: eth
    slippage_std: 0.0005
  - symbol: SOL/USDT
    coinmetrics: sol
    slippage_std: 0.0012

exchange: binance
lookback_bars: 120
initial_cash: 1_000_000
fee_bps: 10
borrow_rate_daily: 0.0002       # 0.02% per day on short notional (~7.3% APR)
model_prefix: policy_h          # v6 hourly ensemble loads from policy_h*.zip

data_paths:
  ohlcv: data/ohlcv
  onchain: data/onchain
  news: data/news
  macro: data/macro
  processed: data/processed/hourly.parquet

features:
  technical: [ret_1d, log_vol_7d, rsi_14, macd, bb_pct, atr_14, ret_60d, ret_180d, vol_20d, ma200_dist]
  onchain: [active_addresses, tx_count, mean_fee_usd]
  sentiment: [sent_mean, sent_count]
  macro: [fng, btc_dominance, funding_rate]

reward:
  weights:
    return:      1.0
    sharpe:      0.3
    drawdown:    0.5
    liquidity:   0.1
    sentiment:   0.1
    loss_asymm:  0.5
    borrow:      1.0
    turnover:    0.002            # v6.2 — vs traded notional/equity (≈2x fee drag); the old
                                  # 3.0 on |Δweights| punished passive drift and froze the policy
  sharpe_window: 168
  liquidity_threshold_pct: 0.01

action:
  allow_short: true
  max_leverage: 1.0
  rebalance_threshold: 0.10       # v6.1 — doubled from 0.05, kills micro-trades

kill_switch:
  enabled: true
  auto_resume_hours: 48   # flash-crash halt auto-clears after cooldown; peak re-bases
  max_daily_loss: 0.05
  max_drawdown_peak: 0.15
  window_bars: 24                 # compare to equity 24 bars ago, not previous bar

invest_limits:
  max_single_position: 0.40
  max_single_short:    0.15       # v6.1 — tightened from 0.25; hard cap on any one short
  max_gross_exposure:  1.00
  max_portfolio_usd:   1000000
  max_trade_notional:  50000
  min_trade_notional:  10

circuit_breaker:
  window: 24                      # 24 hourly bars of log-returns
  threshold_high: 0.012           # 1.2% hourly vol -> scale to 25%
  threshold_mid:  0.009           # 0.9% hourly vol -> scale to 50%

alerts:
  cooldown_seconds: 1800          # per-asset cooldown

train:
  algo: ppo
  total_timesteps: 4_000_000      # v6.1 — 2.7x more than v6; train script overrides per seed
  n_envs: 6
  seed: 42
  bear_sample_prob: 0.50          # v6.1 — 40% -> 50%
  episode_horizon_bars: 300       # v6.1 — 500 -> 300; more episode starts per wallclock
  policy_kwargs:
    net_arch: [256, 256]
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.01

# Chronological with embargoes: train | 1mo gap | val (selection only) | 2wk gap | test.
# Test is touched once per final candidate; regimes are reporting sub-windows of it.
splits:
  train:
    start: 2021-08-01
    end:   2025-08-31
  val:
    start: 2025-10-01
    end:   2026-01-31
  test_regimes:
    full_test:  [2026-02-15, 2026-07-10]
    pre_crash:  [2026-02-15, 2026-05-24]
    crash:      [2026-05-25, 2026-06-20]
    post_crash: [2026-06-21, 2026-07-10]

news:
  enabled: false
  provider: gnews
  queries: ["bitcoin", "ethereum", "solana"]
  max_per_day: 30
