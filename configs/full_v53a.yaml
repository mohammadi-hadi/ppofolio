# v5.3 arm A — feature hygiene only (EVAL_PROTOCOL.md: design change over penalty tuning).
# vs full.yaml: reward turnover REMOVED (v5.2's rejected penalty), mean_fee_usd dropped
# (constant zero since CoinMetrics pulled FeeMeanUSD from the community tier), sentiment
# features dropped (always zero at train and inference since news is disabled).
# Obs dim: 30*(3*12+3)+3+1 = 1174.
assets:
  - symbol: BTC/USDT
    coinmetrics: btc
    slippage_std: 0.0005
  - symbol: ETH/USDT
    coinmetrics: eth
    slippage_std: 0.0005
  - symbol: SOL/USDT
    coinmetrics: sol
    slippage_std: 0.0012

exchange: binance
timeframe: 1d
lookback_days: 30
initial_cash: 1_000_000
fee_bps: 10
model_prefix: policy_s

data_paths:
  ohlcv: data/ohlcv
  onchain: data/onchain
  news: data/news
  processed: data/processed/dataset.parquet

features:
  technical: [ret_1d, log_vol_7d, rsi_14, macd, bb_pct, atr_14, ret_60d, ret_180d, vol_20d, ma200_dist]
  onchain: [active_addresses, tx_count]
  sentiment: []
  macro: [fng, btc_dominance, funding_rate]

reward:
  weights:
    return:      1.0
    sharpe:      0.3
    drawdown:    0.5
    liquidity:   0.1
    sentiment:   0.0
    loss_asymm:  0.5
  sharpe_window: 30
  liquidity_threshold_pct: 0.01

action:
  allow_short: false
  max_leverage: 1.0
  rebalance_threshold: 0.02

kill_switch:
  enabled: true
  auto_resume_hours: 48
  max_daily_loss: 0.08
  max_drawdown_peak: 0.15
  resume_requires_recovery: true
  recovery_ma_bars: 10

invest_limits:
  max_single_position: 0.40
  max_gross_exposure:  1.00
  max_portfolio_usd:   1000000
  max_trade_notional:  250000
  min_trade_notional:  2000

train:
  algo: ppo
  total_timesteps: 800_000
  n_envs: 6
  seed: 42
  bear_sample_prob: 0.40
  episode_horizon_bars: 180
  policy_kwargs:
    net_arch: [256, 256]
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.01

splits:
  train:
    start: 2021-08-01
    end:   2025-08-31
  val:
    start: 2025-10-01
    end:   2026-01-31
  test_regimes:
    full_test:  [2026-02-15, 2026-07-10]
    pre_crash:  [2026-02-15, 2026-05-24]
    crash:      [2026-05-25, 2026-06-20]
    post_crash: [2026-06-21, 2026-07-10]

news:
  enabled: false
  provider: gnews
  queries: ["bitcoin", "ethereum", "solana"]
  max_per_day: 30
