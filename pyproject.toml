[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ppofolio"
version = "0.1.0"
description = "PPO ensemble for multi-asset crypto portfolio allocation (BTC/ETH/SOL) with a pre-registered evaluation protocol, walk-forward backtests, and a paper-trading safety chain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hadi Mohammadi" }]
keywords = [
    "reinforcement-learning",
    "ppo",
    "crypto",
    "trading",
    "portfolio",
    "gymnasium",
    "stable-baselines3",
    "backtesting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "ccxt>=4.3",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "ta>=0.11",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "torch>=2.2",
    "tensorboard>=2.16",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "apscheduler>=3.10",
    "openai>=1.40",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/mohammadi-hadi/ppofolio"
Issues = "https://github.com/mohammadi-hadi/ppofolio/issues"

[tool.hatch.build.targets.wheel]
packages = ["ppofolio"]

[tool.hatch.build.targets.sdist]
include = [
    "ppofolio",
    "tests",
    "configs",
    "scripts",
    "models/MANIFEST.json",
    "EVAL_PROTOCOL.md",
    "CITATION.cff",
    "README.md",
    "LICENSE",
    ".env.example",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
